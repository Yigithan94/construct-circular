<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="circularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d084;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00b574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#009a64;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#20c997;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#198754;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer circular arrows -->
  <g transform="translate(100,100)">
    <!-- Circular background -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#circularGrad)" stroke-width="3" opacity="0.3"/>
    
    <!-- Rotating arrows for circular economy -->
    <path d="M 60,-30 A 45,45 0 0,1 30,60 L 20,50 M 30,60 L 40,50" 
          fill="none" stroke="url(#circularGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -30,60 A 45,45 0 0,1 -60,-30 L -50,-20 M -60,-30 L -50,-40" 
          fill="none" stroke="url(#circularGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -60,30 A 45,45 0 0,1 -30,-60 L -40,-50 M -30,-60 L -20,-50" 
          fill="none" stroke="url(#circularGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30,-60 A 45,45 0 0,1 60,30 L 50,20 M 60,30 L 50,40" 
          fill="none" stroke="url(#circularGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Buildings in center -->
    <g transform="scale(0.8)">
      <!-- Building 1 -->
      <rect x="-35" y="-10" width="15" height="30" fill="url(#buildingGrad)" rx="2"/>
      <rect x="-33" y="-5" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-28" y="-5" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-33" y="5" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-28" y="5" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      
      <!-- Building 2 (taller) -->
      <rect x="-15" y="-25" width="18" height="45" fill="url(#buildingGrad)" rx="2"/>
      <rect x="-12" y="-20" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-6" y="-20" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-12" y="-10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-6" y="-10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-12" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-6" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-12" y="10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="-6" y="10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      
      <!-- Building 3 -->
      <rect x="8" y="-15" width="14" height="35" fill="url(#buildingGrad)" rx="2"/>
      <rect x="11" y="-10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="16" y="-10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="11" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="16" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="11" y="10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="16" y="10" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      
      <!-- Building 4 -->
      <rect x="26" y="-5" width="12" height="25" fill="url(#buildingGrad)" rx="2"/>
      <rect x="28" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="33" y="0" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="28" y="8" width="3" height="3" fill="#ffffff" opacity="0.8"/>
      <rect x="33" y="8" width="3" height="3" fill="#ffffff" opacity="0.8"/>
    </g>
    
    <!-- AI/Tech elements - circuit dots -->
    <circle cx="70" cy="0" r="3" fill="url(#circularGrad)" opacity="0.8"/>
    <circle cx="-70" cy="0" r="3" fill="url(#circularGrad)" opacity="0.8"/>
    <circle cx="0" cy="70" r="3" fill="url(#circularGrad)" opacity="0.8"/>
    <circle cx="0" cy="-70" r="3" fill="url(#circularGrad)" opacity="0.8"/>
    
    <!-- Connection lines -->
    <line x1="67" y1="0" x2="40" y2="0" stroke="url(#circularGrad)" stroke-width="2" opacity="0.6"/>
    <line x1="-67" y1="0" x2="-40" y2="0" stroke="url(#circularGrad)" stroke-width="2" opacity="0.6"/>
  </g>
</svg>